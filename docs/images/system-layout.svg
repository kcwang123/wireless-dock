<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<style>
text{font-family:Arial,"Noto Sans TC",sans-serif;fill:#162033}.title{font-size:34px;font-weight:700}.h{font-size:20px;font-weight:700}.t{font-size:17px}
.tag{fill:#eef2f7;stroke:#44546a;stroke-width:2}.iem{fill:#e9f6ea;stroke:#3b7f48;stroke-width:2}.shure{fill:#e8f0fb;stroke:#2d65a1;stroke-width:2}.mipro{fill:#f3ebfa;stroke:#7c4aa5;stroke-width:2}
</style>
<text x="35" y="55" class="title">Example multi-person desk layout</text>
<text x="35" y="88" class="t">Each vertical column belongs to one person. Columns join left-to-right.</text>
<g transform="translate(70,120)">
<text x="105" y="0" text-anchor="middle" class="h">Person 1</text>
<rect x="0" y="25" width="210" height="150" rx="18" class="shure"/><text x="105" y="105" text-anchor="middle" class="h">Shure UniSlot</text>
<rect x="0" y="190" width="210" height="120" rx="18" class="iem"/><text x="105" y="260" text-anchor="middle" class="h">EK IEM G4</text>
<rect x="0" y="325" width="210" height="80" rx="18" class="tag"/><text x="105" y="375" text-anchor="middle" class="h">CH01 Vocal 1</text>
</g>
<g transform="translate(330,120)">
<text x="105" y="0" text-anchor="middle" class="h">Person 2</text>
<rect x="0" y="25" width="210" height="150" rx="18" class="mipro"/><text x="105" y="105" text-anchor="middle" class="h">MIPRO UniSlot</text>
<rect x="0" y="190" width="210" height="120" rx="18" class="iem"/><text x="105" y="260" text-anchor="middle" class="h">EK IEM G4</text>
<rect x="0" y="325" width="210" height="80" rx="18" class="tag"/><text x="105" y="375" text-anchor="middle" class="h">CH02 Pastor</text>
</g>
<g transform="translate(590,120)">
<text x="105" y="0" text-anchor="middle" class="h">Mic only</text>
<rect x="0" y="25" width="210" height="150" rx="18" class="shure"/><text x="105" y="105" text-anchor="middle" class="h">Shure UniSlot</text>
<rect x="0" y="190" width="210" height="80" rx="18" class="tag"/><text x="105" y="240" text-anchor="middle" class="h">CH03 MC</text>
</g>
<g transform="translate(850,120)">
<text x="105" y="0" text-anchor="middle" class="h">IEM only</text>
<rect x="0" y="25" width="210" height="120" rx="18" class="iem"/><text x="105" y="95" text-anchor="middle" class="h">EK IEM G4</text>
<rect x="0" y="160" width="210" height="80" rx="18" class="tag"/><text x="105" y="210" text-anchor="middle" class="h">IEM4 Guest</text>
</g>
<text x="600" y="610" text-anchor="middle" class="h">No large base frame · independent printable modules · horizontal + front/rear expansion</text>
</svg>